# This workflow will review a GloBI indexed dataset.
# For more information see: https://globalbioticinteractions.org

name: GloBI review by Elton

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  schedule:
    - cron: "0 0 * * 1"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install dependencies
        run: sudo apt install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended latex-xcolor pandoc 
      - name: generate letter pdf
        run: pandoc --template=template-letter.tex example/letter.md -o letter.pdf 
      - name: upload letter.pdf
        uses: actions/upload-artifact@v7
        with:
          path: letter.pdf
          archive: false
